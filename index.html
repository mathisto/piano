<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- 'unsafe-inline' styles: the pages set style="" in their HTML. The beacon is Cloudflare's, injected on the web only; the iPad app (capacitor://localhost) is 'self' and reads the corpus from the site. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://app.pagetohand.com https://cloudflareinsights.com; media-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page to Hand</title>
    <meta name="description" content="Piano practice for any MIDI or MusicXML file: a calm grand staff and falling notes, wait mode, slow tempo, loops, sight-reading and scales. Free in your browser, no account." />
    <link rel="canonical" href="https://app.pagetohand.com/" />
    <!-- Ground: Matinée, then Nocturne. src/theme.ts sets both when Settings forces one mode. -->
    <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)" data-auto="#f3efe6" />
    <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)" data-auto="#0c0e12" />
    <!-- before first paint: a forced Appearance sets data-theme here (a module script would run after it) -->
    <script src="/theme.js"></script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
